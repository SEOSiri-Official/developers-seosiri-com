    <!-- PROGRAMMATIC GLOBAL NOFOLLOW INTERCEPTOR SCRIPT (PRESENT & FUTURE PROOF) -->
    <script>
      (function() {
        function enforceSystemNofollow() {
          var links = document.querySelectorAll('a[href]');
          for (var i = 0; i < links.length; i++) {
            var href = links[i].getAttribute('href');
            if (href && /^https?:\/\//i.test(href)) {
              if (!href.includes('seosiri.com')) {
                links[i].setAttribute('rel', 'nofollow noopener noreferrer');
              }
            }
          }
        }

        // 1. Enforce on initial DOM Load
        document.addEventListener('DOMContentLoaded', enforceSystemNofollow);

        // 2. Enforce on dynamic SPA re-renders and modal popups via MutationObserver
        if (typeof MutationObserver !== 'undefined') {
          var observer = new MutationObserver(function(mutations) {
            enforceSystemNofollow();
          });
          observer.observe(document.documentElement, { childList: true, subtree: true });
        }

        // 3. Fallback global click interceptor
        document.addEventListener('click', function(e) {
          var target = e.target.closest('a[href]');
          if (target) {
            var href = target.getAttribute('href');
            if (href && /^https?:\/\//i.test(href) && !href.includes('seosiri.com')) {
              target.setAttribute('rel', 'nofollow noopener noreferrer');
            }
          }
        }, true);
      })();
    </script>
